## Mosquitto config - CP5 (T01)
## Autenticação obrigatória; sem cliente anônimo.

listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Tópicos usados pelo sistema (documentação, não é ACL):
#   fabrica/{id_maquina}/sensores  -> telemetria
#   fabrica/{id_maquina}/status    -> LWT online/offline
